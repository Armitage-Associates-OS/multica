# Armitage build: compiles the upstream Dockerfile (Go backend) and Dockerfile.web
# (Next.js web) from this branch into the Armitage registry acrarmitagemkt.
# Sign-in is OIDC (federated credential on the armitage branch), so no registry
# password or client secret is stored in GitHub.
name: build-images

on:
  push:
    branches: [armitage]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrarmitagemkt
  IMAGE_TAG: 0.6.1-armitage.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: multica-backend
            dockerfile: Dockerfile
            cache_flag: ""
          # --no-cache: the first two web builds failed in ACR Tasks with
          # "failed to get layer ... layer does not exist" at COPY apps/web/
          # (runs cr2, cr3), a builder storage fault, not a Dockerfile fault.
          - image: multica-web
            dockerfile: Dockerfile.web
            cache_flag: "--no-cache"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The build runs inside ACR Tasks, so the runner needs no Docker daemon.
      # VERSION feeds the Go ldflags; the web image reads NEXT_PUBLIC_APP_VERSION.
      - name: az acr build ${{ matrix.image }}
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --file "${{ matrix.dockerfile }}" \
            --image "${{ matrix.image }}:${IMAGE_TAG}" \
            --image "${{ matrix.image }}:armitage-latest" \
            --build-arg VERSION="${IMAGE_TAG}" \
            --build-arg NEXT_PUBLIC_APP_VERSION="${IMAGE_TAG}" \
            --build-arg COMMIT="${{ github.sha }}" \
            --platform linux/amd64 \
            --timeout 3600 \
            ${{ matrix.cache_flag }} \
            .
